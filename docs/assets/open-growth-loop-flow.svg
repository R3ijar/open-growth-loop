<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Growth Loop workflow</title>
  <desc id="desc">Local CSV inputs feed a freshness check, ranked candidates, one daily plan, a focused prompt or issue draft, completed action recording, outcome recording, and local action memory.</desc>
  <rect width="960" height="220" rx="16" fill="#0D1117"/>
  <rect x="1" y="1" width="958" height="218" rx="15" stroke="#30363D" stroke-width="2"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7DD3FC"/>
    </marker>
  </defs>
  <rect x="40" y="38" width="156" height="104" rx="10" fill="#111827" stroke="#334155"/>
  <text x="62" y="66" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="13" font-weight="700">1. Local signals</text>
  <text x="62" y="92" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Search CSV</text>
  <text x="62" y="113" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Events + inventory</text>
  <text x="62" y="134" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Freshness status</text>

  <rect x="230" y="38" width="156" height="104" rx="10" fill="#0B1220" stroke="#38BDF8"/>
  <text x="252" y="66" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="13" font-weight="700">2. Rank candidates</text>
  <text x="252" y="94" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">release evidence</text>
  <text x="252" y="115" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">funnel dropoffs</text>
  <text x="252" y="136" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">search opportunities</text>

  <rect x="420" y="38" width="156" height="104" rx="10" fill="#111827" stroke="#38BDF8"/>
  <text x="442" y="66" fill="#E0F2FE" font-family="Arial, sans-serif" font-size="13" font-weight="700">3. Pick one plan</text>
  <text x="442" y="94" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">one focused action</text>
  <text x="442" y="115" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Decision Trace v2</text>
  <text x="442" y="136" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">freshness warnings</text>

  <rect x="610" y="38" width="156" height="104" rx="10" fill="#0B1220" stroke="#34D399"/>
  <text x="632" y="66" fill="#DCFCE7" font-family="Arial, sans-serif" font-size="13" font-weight="700">4. Do the work</text>
  <text x="632" y="94" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">Codex prompt</text>
  <text x="632" y="115" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">issue draft</text>
  <text x="632" y="136" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">record artifact</text>

  <rect x="800" y="38" width="120" height="104" rx="10" fill="#172554" stroke="#93C5FD"/>
  <text x="818" y="66" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="13" font-weight="700">5. Learn</text>
  <text x="818" y="94" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">outcome</text>
  <text x="818" y="115" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">memory</text>
  <text x="818" y="136" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="13">next ranking</text>

  <path d="M 196 90 H 218" stroke="#7DD3FC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 386 90 H 408" stroke="#7DD3FC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 576 90 H 598" stroke="#7DD3FC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 766 90 H 788" stroke="#7DD3FC" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 860 146 V 178 H 308 V 146" stroke="#475569" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
</svg>
