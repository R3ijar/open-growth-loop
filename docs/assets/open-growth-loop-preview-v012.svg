<svg width="960" height="500" viewBox="0 0 960 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Growth Loop terminal preview</title>
  <desc id="desc">A terminal-style preview showing Open Growth Loop checking data freshness, selecting one evidence-based maintainer action, and explaining the decision trace.</desc>
  <rect width="960" height="500" rx="18" fill="#0D1117"/>
  <rect x="1" y="1" width="958" height="498" rx="17" stroke="#30363D" stroke-width="2"/>
  <rect x="24" y="24" width="912" height="452" rx="12" fill="#111827"/>
  <rect x="24" y="24" width="912" height="42" rx="12" fill="#1F2937"/>
  <circle cx="51" cy="45" r="6" fill="#F87171"/>
  <circle cx="73" cy="45" r="6" fill="#FBBF24"/>
  <circle cx="95" cy="45" r="6" fill="#34D399"/>
  <text x="120" y="50" fill="#CBD5E1" font-family="Consolas, monospace" font-size="14">open-growth-loop</text>
  <text x="50" y="98" fill="#93C5FD" font-family="Consolas, monospace" font-size="18">$ ogl freshness --workspace .</text>
  <text x="50" y="130" fill="#A7F3D0" font-family="Consolas, monospace" font-size="16">freshness: ok - sample files marked as demos - no hosted service</text>
  <text x="50" y="168" fill="#93C5FD" font-family="Consolas, monospace" font-size="18">$ ogl plan --workspace .</text>
  <rect x="50" y="192" width="860" height="154" rx="10" fill="#0B1220" stroke="#334155"/>
  <text x="74" y="226" fill="#F8FAFC" font-family="Consolas, monospace" font-size="18">Action: release_evidence</text>
  <text x="74" y="256" fill="#CBD5E1" font-family="Consolas, monospace" font-size="16">Asset: /guides/configuration-checklist</text>
  <text x="74" y="284" fill="#CBD5E1" font-family="Consolas, monospace" font-size="16">Why: staged work should be proven public before creating another asset.</text>
  <text x="74" y="314" fill="#A7F3D0" font-family="Consolas, monospace" font-size="16">Decision Trace v2: winner, alternatives, losing reasons, thresholds.</text>
  <text x="50" y="378" fill="#93C5FD" font-family="Consolas, monospace" font-size="18">$ ogl prompt &amp;&amp; ogl issue-drafts</text>
  <text x="50" y="418" fill="#E5E7EB" font-family="Consolas, monospace" font-size="16">Reviewable Markdown/JSON out. No automatic publishing. No raw user data.</text>
  <text x="50" y="456" fill="#A7F3D0" font-family="Consolas, monospace" font-size="16">Conservative by default: freshness, decision trace, outcome memory.</text>
</svg>
